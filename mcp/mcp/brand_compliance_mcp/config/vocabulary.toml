# Text that could not be turned into a rule but clearly concerns something this tool
# cannot do (a missing asset, an unsupported feature) is "understood but not applied",
# not "could not interpret". Checked after the section list above, anywhere in the guide.
[[phrase_status]]
patterns = ["\\blogo\\b", "\\bwordmark\\b"]
status = "understood_not_applicable"
reason = "Logo is applied only when a logo asset is supplied; this tool never invents a logo."

[[phrase_status]]
patterns = ["\\bwave ornament\\b", "\\bwave graphic\\b"]
status = "understood_not_applicable"
reason = "Needs a design asset (wave artwork); none supplied."

[[phrase_status]]
patterns = ["\\bicons?\\b"]
status = "understood_not_applicable"
reason = "Icon styling is not supported in V1."
